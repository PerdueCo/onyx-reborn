<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Onyx Reborn{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/static/css/onyx.css">
  {% block head_extra %}{% endblock %}
</head>
<body class="public-body">

  <!-- Top bar — dark navy, wordmark left, Sign In right (hidden on mobile via .topbar-signin) -->
  <header class="public-topbar">
    <span class="wordmark"><strong>Onyx</strong> Reborn</span>
    {% block topbar_right %}
      <a href="/login" class="btn btn-primary btn-sm topbar-signin"
         style="height:44px;line-height:44px;padding:0 20px;font-size:18px;border-radius:8px;">Sign in</a>
    {% endblock %}
  </header>

  <div class="public-content">
    {% block content %}{% endblock %}
  </div>

  <footer class="public-footer">
    <span class="footer-full">
      <span class="footer-wordmark"><strong>Onyx</strong> Reborn</span> — BSSI Modernization
    </span>
    <span class="footer-short"><strong>BSSI Modernization</strong></span>
  </footer>

</body>
</html>
